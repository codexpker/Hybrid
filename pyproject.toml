[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-tsad-research"
version = "0.1.0"
description = "Auditable packaging of the existing Hybrid TSAD research core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
data = ["numpy", "pandas"]
evaluation = ["numpy", "scikit-learn"]
model = ["numpy", "pandas", "torch", "torch-frft"]

[project.scripts]
hybrid-tsad = "hybrid_tsad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hybrid_tsad = ["core_provenance.json"]
